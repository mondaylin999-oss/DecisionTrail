services:
  - type: web
    name: decisiontrail-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: APP_CHECK_ENFORCE_API
        value: "false"
